name: PHP security

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  phpstan-phpcs:
    name: PHPStan and PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: composer phpstan --no-interaction

      - name: PHPCS
        run: composer phpcs --no-interaction

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          categories: security
          exclude-directories: vendor,node_modules
